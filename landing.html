<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photobooth - Your Photo</title>
<style>body{margin:0;padding:16px;background:radial-gradient(circle at 20% 10%,#3b2a8f,#0A0A12 60%);color:#F1F0FF;font-family:system-ui,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}.c{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(16px);border-radius:24px;max-width:480px;width:100%;padding:24px;text-align:center;animation:r .6s cubic-bezier(.2,.8,.2,1)}@keyframes r{from{opacity:0;transform:translateY(24px) scale(.97)}}h1{margin:0 0 8px;font-size:1.4rem;background:linear-gradient(135deg,#7C5CFF,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}img{max-width:100%;max-height:55vh;border-radius:14px;margin:12px 0;box-shadow:0 12px 40px rgba(0,0,0,.5)}a,button{display:block;width:100%;margin:8px 0;padding:14px;border-radius:999px;border:0;font-weight:700;font-size:1.05rem;font-family:inherit;text-decoration:none;text-align:center;cursor:pointer;background:linear-gradient(135deg,#7C5CFF,#22D3EE);color:#fff}button.s{background:rgba(255,255,255,.12)}#st{min-height:22px;font-weight:600;color:#A3A1C2}</style></head><body><div class="c"><h1>Your Photo is Ready!</h1><div id="st">Loading...</div>
<img id="im" alt="Your photo"><a id="dl" download>Download Photo</a><button id="sv" class="s" style="display:none">Save to Photos</button>
<p style="font-size:.8rem;color:#A3A1C2">iPhone: tap Save to Photos, or press and hold the photo.</p></div>
<script>
const n=(new URLSearchParams(location.search).get('n')||'').replace(/[^A-Za-z0-9._-]/g,''),st=document.getElementById('st');
if(!n||!/\.jpe?g$/i.test(n))st.textContent='No photo specified.';
else{const parts=location.pathname.split('/').filter(Boolean),owner=location.hostname.split('.')[0],repo=parts[0],
url='https://raw.githubusercontent.com/'+owner+'/'+repo+'/main/99-13years-anniversary/'+n;
document.getElementById('im').src=url;
fetch(url).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{const f=new File([b],n,{type:'image/jpeg'}),u=URL.createObjectURL(b),a=document.getElementById('dl');a.href=u;a.download=n;st.textContent='Tap Download to save';
if(navigator.canShare&&navigator.canShare({files:[f]})){const s=document.getElementById('sv');s.style.display='block';s.onclick=()=>navigator.share({files:[f]}).catch(()=>{})}}).catch(()=>{st.textContent='Photo not found yet - wait a moment and refresh.';document.getElementById('dl').href=url});}
</script></body></html>
